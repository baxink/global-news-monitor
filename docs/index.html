<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球主流媒体时政监控</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1 class="title">全球主流媒体时政监控</h1>
      <p class="subtitle">
        覆盖 10 国主流媒体 · 每 6 小时自动更新 · 点击标题直达原文
      </p>
      <p class="meta-info" id="metaInfo">加载中...</p>
    </div>
  </header>

  <main class="main">
    <div class="controls">
      <div class="country-filters" id="countryFilters">
        <button class="country-btn active" data-country="">全部</button>
      </div>
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="搜索标题与摘要..."
          autocomplete="off"
        >
      </div>
    </div>

    <div class="news-count" id="newsCount"></div>

    <div class="news-grid" id="newsGrid">
      <div class="loading">正在加载新闻数据...</div>
    </div>
  </main>

  <footer class="footer">
    <p>数据来源：全球主流媒体公开 RSS Feed · 仅供信息参考</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
