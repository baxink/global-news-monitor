<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nature-daily</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <p class="masthead-kicker">Nature Daily Digest</p>
      <h1 class="masthead-title">Nature Daily</h1>
      <div class="masthead-meta">
        <p class="masthead-summary">每天北京时间早上 6 点自动更新 7 个 Nature 版面，每版精选 1 篇文章。</p>
        <p class="meta-info" id="metaInfo">加载中...</p>
      </div>
    </div>
  </header>

  <main class="frontpage" id="digestGrid">
    <section class="frontpage-loading">
      <div class="loading">正在加载今日日报...</div>
    </section>
  </main>

  <footer class="footer">
    <p>数据来源：Nature 公开页面与 RSS · 页面仅做个人学习与阅读索引</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
